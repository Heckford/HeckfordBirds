<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myrtle Rocks Bird and Bat Detections</title>
  <style>
    body {
      background-color: #f6f0e2;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .collage-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    img {
      max-width: 98vw;
      max-height: 98vh;
      height: auto;
      display: block;
    }
    .bird-link {
      position: absolute;
      display: block;
      border-radius: 10px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .bird-link:hover {
      background-color: rgba(43, 36, 29, 0.06);
      box-shadow: 0 0 0 1px rgba(43, 36, 29, 0.18);
    }
  </style>
</head>
<body>
  <div class="collage-wrapper" id="wrapper">
    <img id="collage" src="HeckfordBirds.png" alt="Myrtle Rocks Bird and Bat Detections">
  </div>

  <script>
    async function loadFreshCollage() {
      const ts = Date.now();
      document.getElementById("collage").src = "HeckfordBirds.png?t=" + ts;

      try {
        const resp = await fetch("species_map.json?t=" + ts);
        if (!resp.ok) return;
        const spots = await resp.json();

        const wrapper = document.getElementById("wrapper");
        wrapper.querySelectorAll(".bird-link").forEach(el => el.remove());

        spots.forEach(s => {
          const a = document.createElement("a");
          a.className = "bird-link";
          a.href = s.target_url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.title = `${s.common_name} (${s.detections}) — View on ${s.site_name}`;
          a.style.left = s.left_pct + "%";
          a.style.top = s.top_pct + "%";
          a.style.width = s.width_pct + "%";
          a.style.height = s.height_pct + "%";
          wrapper.appendChild(a);
        });
      } catch (e) {
        console.warn("Could not load species_map.json yet:", e);
      }
    }

    loadFreshCollage();
    setInterval(loadFreshCollage, 900000);
  </script>
</body>
</html>
