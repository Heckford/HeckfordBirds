<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myrtle Rocks Bird and Bat Detections</title>
  <style>
    body {
      background-color: #f6f0e2;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    img {
      max-width: 98vw;
      max-height: 98vh;
      height: auto;
    }
  </style>
</head>
<body>
  <img id="collage" src="HeckfordBirds.png" alt="Myrtle Rocks Bird and Bat Detections">
  <script>
    function loadFreshCollage() {
      document.getElementById("collage").src = "HeckfordBirds.png?t=" + Date.now();
    }
    loadFreshCollage(); // Forces the newest image to load right when the page opens
    setInterval(loadFreshCollage, 900000); // Refreshes every 15 minutes (900,000 ms)
  </script>
</body>
</html>
