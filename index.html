<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myrtle Rocks Bird and Bat Detections</title>
  <style>
    body {
      background-color: #f6f0e2;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
    }
    .view-toggle {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 20;
      display: inline-flex;
      background-color: #ebe2ce;
      border: 1px solid #cbbda6;
      border-radius: 999px;
      padding: 3px;
      box-shadow: 0 2px 6px rgba(43, 36, 29, 0.08);
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: #5c4e3f;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .view-toggle button.active {
      background-color: #3b3228;
      color: #f6f0e2;
    }
    .collage-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    img {
      max-width: 98vw;
      max-height: 96vh;
      height: auto;
      display: block;
    }
    .bird-link {
      position: absolute;
      display: block;
      border-radius: 10px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .bird-link:hover {
      background-color: rgba(43, 36, 29, 0.06);
      box-shadow: 0 0 0 1px rgba(43, 36, 29, 0.18);
    }
  </style>
</head>
<body>
  <div class="view-toggle" role="group" aria-label="Timeframe Toggle">
    <button id="btn-48h" class="active" onclick="switchView('48h')">Last 48 Hours</button>
    <button id="btn-ytd" onclick="switchView('ytd')">Year to Date</button>
  </div>

  <div class="collage-wrapper" id="wrapper">
    <img id="collage" src="HeckfordBirds.png" alt="Myrtle Rocks Bird and Bat Detections">
  </div>

  <script>
    let currentView = "48h";

    function switchView(view) {
      currentView = view;
      document.getElementById("btn-48h").classList.toggle("active", view === "48h");
      document.getElementById("btn-ytd").classList.toggle("active", view === "ytd");
      loadFreshCollage();
    }

    async function loadFreshCollage() {
      const ts = Date.now();
      const pngFile  = currentView === "ytd" ? "HeckfordBirds_YTD.png" : "HeckfordBirds.png";
      const jsonFile = currentView === "ytd" ? "species_map_ytd.json" : "species_map.json";

      document.getElementById("collage").src = pngFile + "?t=" + ts;

      try {
        const resp = await fetch(jsonFile + "?t=" + ts);
        if (!resp.ok) return;
        const spots = await resp.json();

        const wrapper = document.getElementById("wrapper");
        wrapper.querySelectorAll(".bird-link").forEach(el => el.remove());

        spots.forEach(s => {
          const a = document.createElement("a");
          a.className = "bird-link";
          a.href = s.target_url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.title = `${s.common_name} (${s.detections}) — View on ${s.site_name}`;
          a.style.left = s.left_pct + "%";
          a.style.top = s.top_pct + "%";
          a.style.width = s.width_pct + "%";
          a.style.height = s.height_pct + "%";
          wrapper.appendChild(a);
        });
      } catch (e) {
        console.warn("Could not load species map yet:", e);
      }
    }

    loadFreshCollage();
    setInterval(loadFreshCollage, 900000);
  </script>
</body>
</html>
